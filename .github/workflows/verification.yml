name: Verification

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend, public build, and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -- --base=./
      - run: node scripts/build-public-demo.mjs
      - run: node scripts/verify-public-site.mjs
      - name: Confirm the committed Pages bundle matches source
        run: git diff --exit-code -- docs/app

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test --locked --manifest-path backend/Cargo.toml
