[package]
name = "zcanary-keeper-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
age = "=0.12.1"
bech32 = "=0.11.1"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
secrecy = "=0.10.3"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["alloc"] }
zcanary-core = { path = "../zcanary-core" }
zcanary-crypto = { path = "../zcanary-crypto" }
zcanary-keeper = { path = "../zcanary-keeper" }
zcanary-storage = { path = "../zcanary-storage" }
